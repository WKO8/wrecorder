[package]
name = "wrecorder"
version = "0.1.0"
edition = "2021"
description = "Gravador de tela e áudio rápido para Linux e Windows (MP4 / WAV / MP3)"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
crossterm = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
winit = "0.30"
softbuffer = "0.4"
global-hotkey = "0.10"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["randr"] }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast", "global_shortcuts"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
libc = "0.2"
futures-util = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
cpal = "0.18"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
